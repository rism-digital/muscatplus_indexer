[project]
name = "muscatplus_indexer"
version = "v1.0.4"
description = ""
authors = [{ name = "Andrew Hankinson", email = "andrew.hankinson@rism.digital" }]
requires-python = ">=3.13,<4.0"
dependencies = [
    "dbutils (>=3.0,<4.0)",
    "pyyaml (>=6.0.0,<7.0.0)",
    "datelib @ git+https://github.com/rism-digital/datelib.git@main",
    "pyreqwest (>=0.11.1,<0.12.0)",
    "sentry-sdk (>=2.19.0,<3.0.0)",
    "orjson (>=3.10.3,<4.0.0)",
    "psycopg[pool] (>=3.2.6)",
    "pymarc (>=5.3.1)",
    "verovio (>=5.2.1)",
    "mysqlclient>=2.2.7",
]

[dependency-groups]
dev = [
    "ipython>=9.0.0,<10",
    "mypy>=1.11.2,<2",
    "pip>=25.1.1",
    "pyright>=1.1.405",
    "pytest>=9.1.0",
    "types-pyyaml>=6.0.12.20250402",
]

[tool.pyright]
reportMissingImports = false

[tool.uv]
package = false
prerelease = "allow"

[[tool.uv.index]]
name = "PyPI"
url = "https://pypi.org/simple/"
default = true

[[tool.uv.index]]
name = "TestPyPI"
url = "https://test.pypi.org/simple/"
explicit = true

[tool.uv.sources]
# pymarc = { git = "https://gitlab.com/pymarc/pymarc.git", rev = "main" }
 pymarc = { git = "https://gitlab.com/ahankinson/pymarc.git", rev = "constructor-searching-optimizations" }

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # pycodestyle warnings
    "W",
    # Pyflakes
    "F",
    # pyupgrade
    ## Flake8 plugins
    "UP",
    # flake8-bugbear
    "B",
    # flake8-comprehensions
    "C",
    # flake8-django
    "DJ",
    # flake8-bandit
    "S",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

ignore = [
    # Ignore Pycodestyle line-length warnings, (mainly long comments).
    "E501",
    # Ignore McCabe complexity (for now).
    "C901",
]
