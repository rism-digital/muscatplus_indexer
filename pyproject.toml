[tool.poetry]
package-mode = false
requires-poetry = '>=2.0,<3.0'

[tool.poetry.dependencies]
verovio = {  allow-prereleases = true }
#pymarc = {git = "https://gitlab.com/ahankinson/pymarc", rev = "fix-tag-length"}

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[[tool.poetry.source]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
priority = "supplemental"

[tool.poetry.group.dev.dependencies]
ipython = "^8.0.0"
mypy = "^1.11.2"

[tool.black]
line-length = 121

[build-system]
requires = ['poetry-core (>=2.0,<3.0)']
build-backend = "poetry.masonry.api"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # pycodestyle warnings
    "W",
    # Pyflakes
    "F",
    # pyupgrade
    ## Flake8 plugins
    "UP",
    # flake8-bugbear
    "B",
    # flake8-comprehensions
    "C",
    # flake8-django
    "DJ",
    # flake8-bandit
    "S",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

ignore = [
    # Ignore Pycodestyle line-length warnings, (mainly long comments).
    "E501",
    # Ignore McCabe complexity (for now).
    "C901",
]
[project]
name = "muscatplus_indexer"
description = ""
version = "v1.0.4"
authors = [{name = "Andrew Hankinson", email = "andrew.hankinson@rism.digital"}]
requires-python = '>=3.11,<4.0'
dependencies = ['dbutils (>=3.0,<4.0)', 'mysqlclient (>=2.2.4,<3.0.0)', 'pyyaml (>=6.0.0,<7.0.0)', 'edtf @ git+https://github.com/rism-digital/python-edtf.git@performance-enhancements', 'httpx (>=0.28.0,<0.29.0)', 'verovio (>=4.4.0.dev118,<5.0.0)', 'sentry-sdk (>=2.0.0,<3.0.0)', 'orjson (>=3.10.3,<4.0.0)', 'pymarc @ git+https://gitlab.com/ahankinson/pymarc.git@optimize-fields', 'psycopg[pool] (==3.2.4)']
